services:
  - type: web
    name: gold-options-hedge
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: DATA_FILE
        value: /app/data/portfolio.json
      - key: APP_USERNAME
        value: xauadmin
      - key: APP_PASSWORD
        sync: false
      - key: VIEWER_USERNAME
        value: xauwhales
      - key: VIEWER_PASSWORD
        sync: false
