services:
  gold-options-hedge:
    build:
      context: .
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_FILE: /app/data/portfolio.json
      APP_USERNAME: ${APP_USERNAME:-xauadmin}
      APP_PASSWORD: ${APP_PASSWORD:?请先在 .env 设置 APP_PASSWORD}
      VIEWER_USERNAME: ${VIEWER_USERNAME:-xauwhales}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:?请先在 .env 设置 VIEWER_PASSWORD}
      MARKETDATA_TOKEN: ${MARKETDATA_TOKEN:-}
      TRADIER_API_TOKEN: ${TRADIER_API_TOKEN:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
